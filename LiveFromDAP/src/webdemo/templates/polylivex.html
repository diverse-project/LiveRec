<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
    <div id="page">
        <div id="editor-container">
            <div class="editor-wrapper">
                <textarea id="editor" name="editor">
{% if language == 'python' %}
#@ex1:foo(1,2)
#@ex2:foo(1,3)
def foo(a, b):
    t = bar(a)
    #@ex1:probe : t
    for i in range(0, 5):
        t = t + 1
        #@ex1:probe : t if £ t % 2 == 0 £
    return a + b + t

#@ex3:bar(3)
#@ex4:bar(1)
def bar(x):
    polyglotEval("js", "/test/square.js")
    #@ex1:probe JS: t0
    r = polyglotEval("js", "square(5)")
    #@ex2:probe : r
    #@ex1:probe JS.square: t1
    #@ex1:probe JS.foo: t3
    return r*2
{% elif language == 'javascript' %}
//@ex1:foo(1,2)
function foo(a, b){
    var t = bar(a);
    //@ex1:probe : t
    for (let i = 0; i < 5; i++) {
        t = t + 1;
        //@ex1:probe : t if £ t % 2 == 0 £
    }
    return a + b + t;
}

function bar(x) {
    polyglotEval("py", "/test/foobar.py");
    let r = polyglotEval("py", "foobar(2)");
    //@ex1:probe PY.foobar: t
    return r*2;
}
{% endif %}
                </textarea>
            </div>
        </div>
        <div id="editor-resizer"></div>
        <div id="output-container">
            <div class="output-wrapper">
                <textarea id="output" name="output"></textarea>
            </div>
        </div>
    </div>
    <div id="execution-status">
        <div id="execution-spinner" class="preloader-wrapper small active" style="display: none;">
            <div class="spinner-layer spinner-black-only">
                <div class="circle-clipper left">
                    <div class="circle"></div>
                </div>
                <div class="gap-patch">
                    <div class="circle"></div>
                </div>
                <div class="circle-clipper right">
                    <div class="circle"></div>
                </div>
            </div>
        </div>
        <i id="agent-ready" class="material-icons green" style="display: none;">check</i>
        <i id="agent-not-ready" class="material-icons red">close</i>
    </div>

    <!-- Scripts -->
    <script>
        const config = {
            language: "{{ language }}",
            sessionId: "{{ session_id }}"
        };
    </script>
    
    <!-- External Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/go/go.min.js"></script>
    
    <!-- Application Scripts -->
    <script src="{{ url_for('static', filename='js/editor.js') }}"></script>
    <script src="{{ url_for('static', filename='js/output-handler.js') }}"></script>
    <script src="{{ url_for('static', filename='js/socket-manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/resize.js') }}"></script>
    <script>
        // Initialize application
        document.addEventListener('DOMContentLoaded', () => {
            window.editor = new Editor('editor', config.language);
            window.socketManager = new SocketManager(config.sessionId, config.language);
        });
    </script>
</body>
</html>
