[project]
name = "LiveFromDAP"
description = "Live backend builded on DAP"
readme = "README.md"
version = "0.1.0"
authors = [
    { name = "anonymous" },
]
dependencies = [
    "debugpy",
    "pycparser",
    "flask_socketio",
    "pandas",
    "matplotlib",
    "tree_sitter",
    "gopygo",
    "requests"
]

[build-system]
requires = ["setuptools>=43.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--import-mode=importlib",
]
testpaths = [
    "tests"
]

[project.scripts]
liverec = "webdemo.main:run"